name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pyright
      - run: pytest

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
        env:
          JWT_SECRET_KEY: ci-only-secret
      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
