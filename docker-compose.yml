x-app-environment: &app-environment
  MODE: ${MODE:-PROD}
  DB_NAME: easybook
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: easybook
  DB_PASS: easybook
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-in-production}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  IMAGE_DIR: /app/src/static/images

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: easybook
      POSTGRES_USER: easybook
      POSTGRES_PASSWORD: easybook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybook -d easybook"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - hotel_images:/app/src/static/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A src.tasks.celery_app.celery_instance worker --loglevel=INFO
    environment: *app-environment
    volumes:
      - hotel_images:/app/src/static/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  hotel_images:
