x-app-environment: &app-environment
  MODE: ${MODE:-LOCAL}
  DB_NAME: ${DB_NAME:-easybook}
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: easybook
  DB_PASS: easybook
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-before-production}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
  IMAGE_DIR: /app/src/static/images

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-easybook}
      POSTGRES_USER: easybook
      POSTGRES_PASSWORD: easybook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybook -d ${DB_NAME:-easybook}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - ./src/static/images:/app/src/static/images
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
